architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_weathering.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("maven.modrinth:moonlight:${rootProject.moonlight_fabric_modrinth_version}")
    modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
        }
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases" }
    maven { url "https://api.modrinth.com/maven" }
}
